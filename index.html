<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <h1>
      Play Chess
      <img src="favicon.png" alt="Chess" class="title-icon">
</h1>

        <!-- Controls: New Game button placed here so it appears next to AI toggle (script will append AI controls) -->
    <div class="controls">
      <button id="newGameBtn">New Game</button>
      <!-- script.js will add the AI toggle / color / depth controls here -->
    </div>
    
    <!-- Turn indicator -->
    <div style="margin-top:6px; font-weight:600;">
      Turn: <span id="turnIndicator">White</span>
    </div>

    <!-- Board container required by script.js -->
    <div id="board" class="board" aria-label="Chess board"></div>
  </div>

  <!-- Scripts: split by responsibility, loaded in dependency order, from
       the js/ folder. Classic (non-module) scripts share one global scope,
       so later files can use functions/variables declared in earlier ones.
       safeInit() in main.js waits for DOMContentLoaded before touching
       the DOM. -->
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
